<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventory Multi Device</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.5/JsBarcode.all.min.js"></script>

<!-- Firebase (COMPAT VERSION FOR HTML) -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body{margin:0;font-family:monospace;background:#0a0a0f;color:white}
header{padding:15px;background:#13131a;position:sticky;top:0}
button{padding:10px;width:100%;margin-top:5px;background:#7c6aff;border:none;color:white}
input{width:100%;padding:10px;margin:5px 0;background:#1c1c26;color:white;border:1px solid #333}
.card{background:#13131a;padding:15px;margin:10px}
.item{background:#13131a;padding:10px;margin:10px;border-radius:10px}
.status{color:#00e5b0}
</style>
</head>

<body>

<header>Multi Device Inventory</header>

<div class="card">
<h3>Add Item</h3>
<input id="name" placeholder="Name">
<input id="buy" placeholder="Buy price">
<input id="source" placeholder="Source">
<input id="serial" placeholder="Serial">
<input id="model" placeholder="Model">
<button onclick="addItem()">Add</button>
</div>

<div class="card">
<h3>Scanner (Android)</h3>
<button onclick="startScan()">Start Scanner</button>
<div id="reader"></div>
<div id="scanResult"></div>
</div>

<div class="card">
<h3>Inventory</h3>
<div id="list"></div>
</div>

<script>

// 🔥 FIREBASE CONFIG (YOUR DATA)
const firebaseConfig = {
  apiKey: "AIzaSyCjn19_lqHEgfsxjj_Dom7qZhZW2dLn78o",
  authDomain: "inventory-40e86.firebaseapp.com",
  projectId: "inventory-40e86",
  storageBucket: "inventory-40e86.firebasestorage.app",
  messagingSenderId: "415196333352",
  appId: "1:415196333352:web:6e1aef2eb13d7d40a2bc1d",
  measurementId: "G-28EW04WNQL"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let counter = 0;

// SKU generator
function sku(){
  counter++;
  return "AP-" + String(counter).padStart(4,"0");
}

// ADD ITEM → FIREBASE
function addItem(){

  let item = {
    name: name.value,
    buy: buy.value,
    source: source.value,
    serial: serial.value,
    model: model.value,
    sku: sku(),
    status: "Listed",
    time: Date.now()
  };

  db.collection("items").add(item);

  name.value="";
  buy.value="";
  source.value="";
  serial.value="";
  model.value="";
}

// REALTIME LOAD (MULTI DEVICE SYNC)
db.collection("items").onSnapshot(snapshot=>{
  list.innerHTML="";
  snapshot.forEach(doc=>{
    let i = doc.data();

    list.innerHTML += `
      <div class="item">
        <b>${i.name}</b><br>
        ${i.sku}<br>
        <div class="status">${i.status}</div>

        <button onclick="update('${doc.id}','Packing')">Packing</button>
        <button onclick="update('${doc.id}','Shipped')">Shipped</button>
        <button onclick="update('${doc.id}','Delivered')">Delivered</button>

        <button onclick="scanItem('${doc.id}')">Scan Match</button>
      </div>
    `;
  });
});

// UPDATE STATUS (SYNCED)
function update(id,status){
  db.collection("items").doc(id).update({status});
}

// SCAN MATCH (simple manual fallback)
function scanItem(id){
  db.collection("items").doc(id).get().then(d=>{
    scanResult.innerHTML =
      "<h3>"+d.data().name+"</h3><p>"+d.data().status+"</p>";
  });
}

/* SIMPLE SCANNER (ANDROID CHROME) */
function startScan(){

  const html5QrCode = new Html5Qrcode("reader");

  Html5Qrcode.getCameras().then(devices=>{

    html5QrCode.start(
      devices[0].id,
      { fps:10, qrbox:250 },
      text=>{

        db.collection("items")
        .where("sku","==",text)
        .get()
        .then(snap=>{
          snap.forEach(doc=>{
            db.collection("items").doc(doc.id).update({
              status:"Packing"
            });

            scanResult.innerHTML =
              "<h3>FOUND</h3><p>Moved to Packing</p>";
          });
        });

        html5QrCode.stop();

      }
    );

  });

}

</script>

<!-- scanner lib -->
<script src="https://unpkg.com/html5-qrcode"></script>

</body>
</html>
