<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AirPods Business Tracker</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0f">

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap');

:root {
  --bg:#0a0a0f;
  --surface:#13131a;
  --surface2:#1c1c26;
  --border:#2a2a3a;
  --accent:#7c6aff;
  --accent2:#00e5b0;
  --danger:#ff4f6a;
  --text:#e8e8f0;
  --muted:#6b6b80;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'DM Mono', monospace;
  min-height:100vh;
  padding-bottom:80px;
}

header{
  background:var(--surface);
  border-bottom:1px solid var(--border);
  padding:16px;
  display:flex;
  justify-content:space-between;
}

header h1{
  font-family:'Syne';
  font-weight:800;
}

header h1 span{color:var(--accent)}

.badge{
  background:var(--accent);
  padding:3px 10px;
  border-radius:20px;
  font-size:10px;
}

.tabs{
  display:flex;
  background:var(--surface);
  border-bottom:1px solid var(--border);
}

.tab{
  flex:1;
  padding:12px;
  background:none;
  border:none;
  color:var(--muted);
}

.tab.active{
  color:var(--accent);
  border-bottom:2px solid var(--accent);
}

.panel{display:none;padding:16px}
.panel.active{display:block}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.card{
  background:var(--surface);
  border:1px solid var(--border);
  padding:14px;
  border-radius:10px;
}

.label{font-size:10px;color:var(--muted)}
.value{font-family:'Syne';font-size:20px;margin-top:6px}

input,select{
  width:100%;
  padding:10px;
  margin:6px 0;
  background:var(--surface2);
  border:1px solid var(--border);
  color:var(--text);
  border-radius:8px;
}

button.add{
  width:100%;
  padding:12px;
  background:var(--accent);
  border:none;
  color:#fff;
  font-weight:700;
  border-radius:10px;
}

.item{
  background:var(--surface);
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  border:1px solid var(--border);
}
</style>
</head>

<body>

<header>
  <h1>AirPods Tracker</h1>
  <span class="badge">LIVE</span>
</header>

<div class="tabs">
  <button class="tab active" onclick="tab('dash')">Dashboard</button>
  <button class="tab" onclick="tab('stock')">Stock</button>
  <button class="tab" onclick="tab('sales')">Sales</button>
  <button class="tab" onclick="tab('exp')">Expenses</button>
</div>

<div class="panel active" id="dash">
  <div class="grid">
    <div class="card">
      <div class="label">Revenue</div>
      <div class="value" id="rev">£0</div>
    </div>
    <div class="card">
      <div class="label">Profit</div>
      <div class="value" id="profit">£0</div>
    </div>
  </div>
</div>

<div class="panel" id="stock">
  <input id="sname" placeholder="Item">
  <input id="sprice" placeholder="Buy price">
  <button class="add" onclick="addStock()">Add Stock</button>
  <div id="stockList"></div>
</div>

<div class="panel" id="sales">
  <input id="slname" placeholder="Item sold">
  <input id="slprice" placeholder="Sale price">
  <button class="add" onclick="addSale()">Log Sale</button>
  <div id="salesList"></div>
</div>

<div class="panel" id="exp">
  <input id="edesc" placeholder="Expense">
  <input id="eamt" placeholder="Amount">
  <button class="add" onclick="addExp()">Add Expense</button>
  <div id="expList"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "inventory-40e86.firebaseapp.com",
  projectId: "inventory-40e86",
  storageBucket: "inventory-40e86.appspot.com",
  messagingSenderId: "415196333352",
  appId: "1:415196333352:web:6e1aef2eb13d7d40a2bc1d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const ref = doc(db, "tracker", "main");

let data = { stock: [], sales: [], expenses: [] };

function save() {
  setDoc(ref, data);
}

onSnapshot(ref, snap => {
  if (snap.exists()) {
    data = snap.data();
    render();
  }
});

window.addStock = function () {
  data.stock.push({ name: sname.value, price: Number(sprice.value) });
  save(); render();
}

window.addSale = function () {
  data.sales.push({ name: slname.value, price: Number(slprice.value) });
  save(); render();
}

window.addExp = function () {
  data.expenses.push({ desc: edesc.value, amount: Number(eamt.value) });
  save(); render();
}

window.tab = function (t) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  document.getElementById(t).classList.add('active');
  event.target.classList.add('active');
}

function render() {
  stockList.innerHTML = data.stock.map(i => `<div class="item">${i.name} £${i.price}</div>`).join('');
  salesList.innerHTML = data.sales.map(i => `<div class="item">${i.name} £${i.price}</div>`).join('');
  expList.innerHTML = data.expenses.map(i => `<div class="item">${i.desc} £${i.amount}</div>`).join('');

  const revenue = data.sales.reduce((a,b)=>a+(b.price||0),0);
  const expenses = data.expenses.reduce((a,b)=>a+(b.amount||0),0);

  rev.innerText = "£"+revenue;
  profit.innerText = "£"+(revenue-expenses);
}
</script>

</body>
</html>
