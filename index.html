<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AirPods Tracker Pro</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.5/JsBarcode.all.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>

<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0a0a0f;
  --surface:#13131a;
  --surface2:#1c1c26;
  --border:#2a2a3a;
  --accent:#7c6aff;
  --accent2:#00e5b0;
  --text:#e8e8f0;
  --muted:#6b6b80;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'DM Mono', monospace;
}

header{
  padding:16px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  font-family:'Syne';
  font-weight:800;
}

.tabs{
  display:flex;
  background:var(--surface);
  border-bottom:1px solid var(--border);
}

.tab{
  flex:1;
  padding:12px;
  background:none;
  border:none;
  color:var(--muted);
}

.tab.active{
  color:var(--accent);
  border-bottom:2px solid var(--accent);
}

.panel{display:none;padding:16px;}
.panel.active{display:block;}

.card{
  background:var(--surface);
  border:1px solid var(--border);
  padding:14px;
  border-radius:12px;
  margin-bottom:12px;
}

input{
  width:100%;
  padding:10px;
  margin:6px 0;
  background:var(--surface2);
  border:1px solid var(--border);
  color:white;
  border-radius:8px;
}

button{
  width:100%;
  padding:10px;
  margin-top:6px;
  background:var(--accent);
  border:none;
  color:white;
  border-radius:10px;
  font-weight:700;
}

.item{
  background:var(--surface);
  border:1px solid var(--border);
  padding:12px;
  border-radius:12px;
  margin-bottom:10px;
}

.badge{
  color:var(--accent2);
  font-size:12px;
}

.status{
  color:var(--accent2);
  margin-top:5px;
}

.smallbtn{
  background:var(--surface2);
  border:1px solid var(--border);
  margin-top:6px;
}
</style>
</head>

<body>

<header>AirPods Tracker Pro</header>

<div class="tabs">
<button class="tab active" onclick="openTab('dash')">Dashboard</button>
<button class="tab" onclick="openTab('stock')">Stock</button>
<button class="tab" onclick="openTab('scan')">Scanner</button>
</div>

<!-- DASH -->
<div id="dash" class="panel active">
<div class="card">
<h3>Total Items</h3>
<div id="count">0</div>
</div>
</div>

<!-- STOCK -->
<div id="stock" class="panel">

<div class="card">
<h3>Add Item</h3>
<input id="name" placeholder="Item name">
<input id="buy" placeholder="Buy price">
<input id="source" placeholder="Source">
<input id="serial" placeholder="Serial">
<input id="model" placeholder="Model">
<button onclick="addItem()">Add Stock</button>
</div>

<div id="list"></div>

</div>

<!-- SCANNER -->
<div id="scan" class="panel">

<div class="card">
<button onclick="startScan()">Start Scanner</button>
<div id="reader"></div>
<div id="scanResult"></div>
</div>

</div>

<script>

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyCjn19_lqHEgfsxjj_Dom7qZhZW2dLn78o",
  authDomain: "inventory-40e86.firebaseapp.com",
  projectId: "inventory-40e86",
  storageBucket: "inventory-40e86.firebasestorage.app",
  messagingSenderId: "415196333352",
  appId: "1:415196333352:web:6e1aef2eb13d7d40a2bc1d"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* SKU */
let skuCounter = 0;
function sku(){
  skuCounter++;
  return "AP-"+String(skuCounter).padStart(4,"0");
}

/* ADD */
function addItem(){
  db.collection("items").add({
    name:name.value,
    buy:buy.value,
    source:source.value,
    serial:serial.value,
    model:model.value,
    sku:sku(),
    status:"Listed",
    time:Date.now()
  });

  name.value="";
  buy.value="";
  source.value="";
  serial.value="";
  model.value="";
}

/* LIVE SYNC */
db.collection("items").onSnapshot(snap=>{
  list.innerHTML="";
  count.innerHTML=snap.size;

  snap.forEach(doc=>{
    let i=doc.data();

    list.innerHTML+=`
      <div class="item">
        <b>${i.name}</b><br>
        <span class="badge">${i.sku}</span>
        <div class="status">${i.status}</div>

        <button class="smallbtn" onclick="update('${doc.id}','Packing')">Packing</button>
        <button class="smallbtn" onclick="update('${doc.id}','Shipped')">Shipped</button>
        <button class="smallbtn" onclick="update('${doc.id}','Delivered')">Delivered</button>
      </div>
    `;
  });
});

function update(id,status){
  db.collection("items").doc(id).update({status});
}

/* SCANNER */
function startScan(){
  const html5QrCode=new Html5Qrcode("reader");

  Html5Qrcode.getCameras().then(devices=>{
    html5QrCode.start(
      devices[0].id,
      {fps:10,qrbox:250},
      text=>{

        db.collection("items")
        .where("sku","==",text)
        .get()
        .then(snap=>{
          snap.forEach(doc=>{
            db.collection("items").doc(doc.id)
            .update({status:"Packing"});

            scanResult.innerHTML="FOUND ✔ moved to Packing";
          });
        });

        html5QrCode.stop();
      }
    );
  });
}

/* TABS */
function openTab(t){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  document.getElementById(t).classList.add('active');
  event.target.classList.add('active');
}

</script>

</body>
</html>
