<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AirPods Business Tracker</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap');

  :root {
    --bg:#0a0a0f;
    --surface:#13131a;
    --surface2:#1c1c26;
    --border:#2a2a3a;
    --accent:#7c6aff;
    --accent2:#00e5b0;
    --danger:#ff4f6a;
    --text:#e8e8f0;
    --muted:#6b6b80;
  }

  *{margin:0;padding:0;box-sizing:border-box}

  body{
    background:var(--bg);
    color:var(--text);
    font-family:'DM Mono', monospace;
  }

  header{
    padding:16px;
    background:var(--surface);
    border-bottom:1px solid var(--border);
    display:flex;
    justify-content:space-between;
  }

  header h1{
    font-family:'Syne';
    font-weight:800;
  }

  .badge{
    background:var(--accent);
    padding:3px 10px;
    border-radius:20px;
    font-size:10px;
  }

  .tabs{
    display:flex;
    background:var(--surface);
    border-bottom:1px solid var(--border);
  }

  .tab{
    flex:1;
    padding:12px;
    background:none;
    border:none;
    color:var(--muted);
    cursor:pointer;
  }

  .tab.active{
    color:var(--accent);
    border-bottom:2px solid var(--accent);
  }

  .panel{display:none;padding:16px}
  .panel.active{display:block}

  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:16px;
  }

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    padding:14px;
    border-radius:10px;
  }

  .label{
    font-size:10px;
    color:var(--muted);
  }

  .value{
    font-family:'Syne';
    font-size:20px;
    margin-top:6px;
  }

  input,select{
    width:100%;
    padding:10px;
    margin:6px 0;
    background:var(--surface2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:8px;
  }

  button.add{
    width:100%;
    padding:12px;
    background:var(--accent);
    border:none;
    color:white;
    font-family:'Syne';
    font-weight:700;
    border-radius:10px;
  }

  .item{
    background:var(--surface);
    padding:12px;
    margin-top:10px;
    border-radius:10px;
    border:1px solid var(--border);
  }

</style>
</head>

<body>

<header>
  <h1>AirPods Tracker</h1>
  <span class="badge">LIVE</span>
</header>

<div class="tabs">
  <button class="tab active" onclick="tab('dash')">Dashboard</button>
  <button class="tab" onclick="tab('stock')">Stock</button>
  <button class="tab" onclick="tab('sales')">Sales</button>
  <button class="tab" onclick="tab('exp')">Expenses</button>
</div>

<!-- DASH -->
<div class="panel active" id="dash">
  <div class="grid">
    <div class="card">
      <div class="label">Revenue</div>
      <div class="value" id="rev">£0</div>
    </div>
    <div class="card">
      <div class="label">Profit</div>
      <div class="value" id="profit">£0</div>
    </div>
  </div>
</div>

<!-- STOCK -->
<div class="panel" id="stock">
  <input id="sname" placeholder="Item">
  <input id="sprice" placeholder="Buy price">
  <button class="add" onclick="addStock()">Add Stock</button>
  <div id="stockList"></div>
</div>

<!-- SALES -->
<div class="panel" id="sales">
  <input id="slname" placeholder="Item sold">
  <input id="slprice" placeholder="Sale price">
  <button class="add" onclick="addSale()">Log Sale</button>
  <div id="salesList"></div>
</div>

<!-- EXP -->
<div class="panel" id="exp">
  <input id="edesc" placeholder="Expense">
  <input id="eamt" placeholder="Amount">
  <button class="add" onclick="addExp()">Add Expense</button>
  <div id="expList"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "inventory-40e86.firebaseapp.com",
  projectId: "inventory-40e86",
  storageBucket: "inventory-40e86.appspot.com",
  messagingSenderId: "415196333352",
  appId: "1:415196333352:web:6e1aef2eb13d7d40a2bc1d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let stock = [], sales = [], expenses = [];

function listen() {
  onSnapshot(collection(db,"stock"), snap=>{
    stock = snap.docs.map(d=>d.data());
    render();
  });

  onSnapshot(collection(db,"sales"), snap=>{
    sales = snap.docs.map(d=>d.data());
    render();
  });

  onSnapshot(collection(db,"expenses"), snap=>{
    expenses = snap.docs.map(d=>d.data());
    render();
  });
}

listen();

window.addStock = async function(){
  await addDoc(collection(db,"stock"), {
    name: sname.value,
    price: Number(sprice.value)
  });
}

window.addSale = async function(){
  await addDoc(collection(db,"sales"), {
    name: slname.value,
    price: Number(slprice.value)
  });
}

window.addExp = async function(){
  await addDoc(collection(db,"expenses"), {
    desc: edesc.value,
    amount: Number(eamt.value)
  });
}

window.tab = function(t){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  document.getElementById(t).classList.add('active');
  event.target.classList.add('active');
}

function render(){
  stockList.innerHTML = stock.map(i=>`<div class="item">${i.name} £${i.price}</div>`).join('');
  salesList.innerHTML = sales.map(i=>`<div class="item">${i.name} £${i.price}</div>`).join('');
  expList.innerHTML = expenses.map(i=>`<div class="item">${i.desc} £${i.amount}</div>`).join('');

  let revenue = sales.reduce((a,b)=>a+(b.price||0),0);
  let profit = revenue - expenses.reduce((a,b)=>a+(b.amount||0),0);

  rev.innerText = "£"+revenue;
  document.getElementById("profit").innerText = "£"+profit;
}
</script>

</body>
</html>
